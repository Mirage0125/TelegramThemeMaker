name: Build Windows release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Build ZIP and SHA-256
        shell: bash
        run: |
          set -euo pipefail
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          FILE_VERSION="$(tr -d '\r\n' < VERSION.txt)"
          if [[ "$TAG_VERSION" != "$FILE_VERSION" ]]; then
            echo "Tag version ($TAG_VERSION) does not match VERSION.txt ($FILE_VERSION)."
            exit 1
          fi
          mkdir -p dist/TelegramThemeMaker
          rsync -a ./ dist/TelegramThemeMaker/ \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='.env' \
            --exclude='.env.*' \
            --exclude='.venv/' \
            --exclude='venv/' \
            --exclude='env/' \
            --exclude='user_data/' \
            --exclude='logs/' \
            --exclude='__pycache__/' \
            --exclude='.bot.lock' \
            --exclude='.update-state.json' \
            --exclude='*.pyc' \
            --exclude='*.log'
          cd dist
          zip -qr "../TelegramThemeMaker_v${TAG_VERSION}_Windows.zip" TelegramThemeMaker
          cd ..
          sha256sum "TelegramThemeMaker_v${TAG_VERSION}_Windows.zip" > "TelegramThemeMaker_v${TAG_VERSION}_Windows.zip.sha256"

      - name: Publish release assets
        uses: softprops/action-gh-release@v2
        with:
          name: Telegram Theme Maker v${{ github.ref_name }}
          generate_release_notes: true
          files: |
            TelegramThemeMaker_v${{ github.ref_name }}_Windows.zip
            TelegramThemeMaker_v${{ github.ref_name }}_Windows.zip.sha256
