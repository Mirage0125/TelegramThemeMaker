name: Build Windows release

on:
  push:
    branches:
      - main
    paths:
      - VERSION.txt

permissions:
  contents: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Validate version and check for duplicate release
        id: version
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION="$(tr -d '\r\n' < VERSION.txt)"
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "VERSION.txt must contain a version in X.Y.Z format."
            exit 1
          fi
          TAG="v$VERSION"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "A release for $TAG already exists. Bump VERSION.txt before publishing another build."
            exit 1
          fi
          echo "value=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Validate Python syntax
        run: python -m compileall -q .

      - name: Install dependencies for regression tests
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Run regression tests
        run: python -m unittest discover -s tests -v

      - name: Build ZIP and SHA-256
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.value }}"
          mkdir -p dist/TelegramThemeMaker
          rsync -a ./ dist/TelegramThemeMaker/ \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='/tests/' \
            --exclude='/assets/' \
            --exclude='.env' \
            --exclude='.env.*' \
            --exclude='.venv/' \
            --exclude='venv/' \
            --exclude='env/' \
            --exclude='user_data/' \
            --exclude='logs/' \
            --exclude='__pycache__/' \
            --exclude='.bot.lock' \
            --exclude='.update-state.json' \
            --exclude='*.pyc' \
            --exclude='*.log'
          if [[ ! -s assets/welcome.png ]]; then
            echo "Expected bundled welcome image assets/welcome.png is missing."
            exit 1
          fi
          mkdir -p dist/TelegramThemeMaker/defaults
          cp assets/welcome.png dist/TelegramThemeMaker/defaults/welcome.png

          # Guard the migration: the first update from 3.7.3 must never contain
          # an assets/ path because that older updater cannot preserve it.
          if find dist/TelegramThemeMaker/assets -type f -print -quit 2>/dev/null | grep -q .; then
            echo "Release staging unexpectedly contains user-owned assets."
            exit 1
          fi
          test -s dist/TelegramThemeMaker/defaults/welcome.png

          cd dist
          zip -qr "../TelegramThemeMaker_v${VERSION}_Windows.zip" TelegramThemeMaker
          cd ..
          unzip -Z1 "TelegramThemeMaker_v${VERSION}_Windows.zip" > "release-file-list.txt"
          if grep -q '^TelegramThemeMaker/assets/' release-file-list.txt; then
            echo "The release ZIP contains the user-owned assets directory."
            exit 1
          fi
          if ! grep -qx 'TelegramThemeMaker/defaults/welcome.png' release-file-list.txt; then
            echo "The release ZIP is missing defaults/welcome.png."
            exit 1
          fi
          sha256sum "TelegramThemeMaker_v${VERSION}_Windows.zip" > "TelegramThemeMaker_v${VERSION}_Windows.zip.sha256"

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: Telegram Theme Maker ${{ steps.version.outputs.tag }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            TelegramThemeMaker_v${{ steps.version.outputs.value }}_Windows.zip
            TelegramThemeMaker_v${{ steps.version.outputs.value }}_Windows.zip.sha256
